[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitsavor"
version = "0.1.0"
description = "Fruit ripeness research, starting with bananas"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13"]

[project.scripts]
fruitsavor = "fruitsavor.data:main"

[tool.setuptools.packages.find]
where = ["src"]
