[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitsavor"
version = "0.2.0"
description = "Fruit ripeness research, starting with bananas"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1"]

[project.scripts]
fruitsavor = "fruitsavor.data:main"
fruitsavor-api = "fruitsavor.backend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fruitsavor.annotation" = ["workbench.html"]
"fruitsavor.backend" = ["web/*.html", "web/*.js", "web/*.css"]
